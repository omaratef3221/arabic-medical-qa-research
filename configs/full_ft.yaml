# Full Fine-tuning Configuration

# ---- Training Parameters ----
training:
  optimizer: adamw_torch
  learning_rate: 2e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8  # effective batch size = 16
  max_seq_length: 2048
  bf16: true
  gradient_checkpointing: true
  logging_steps: 50
  save_strategy: epoch
  seed: 42

# ---- Stage-specific Epochs ----
stages:
  domain_adaptation:
    num_train_epochs: 3
  task_specific:
    num_train_epochs: 5