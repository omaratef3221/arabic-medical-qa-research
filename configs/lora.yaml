# LoRA Fine-tuning Configuration
# Based on Hu et al. (2022) and Dettmers et al. (2023)

# ---- LoRA Parameters ----
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  task_type: CAUSAL_LM
  bias: none

# ---- Training Parameters ----
training:
  optimizer: adamw_torch
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4  # effective batch size = 16
  max_seq_length: 2048
  bf16: true
  gradient_checkpointing: true
  logging_steps: 50
  save_strategy: epoch
  seed: 42

# ---- Stage-specific Epochs ----
stages:
  domain_adaptation:
    num_train_epochs: 3
  task_specific:
    num_train_epochs: 5